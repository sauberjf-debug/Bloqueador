name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Compilar APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bloqueador-ligacoes-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publica o .apk na aba "Releases" para baixar direto pelo celular
      - name: Publicar APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk bloqueador-ligacoes.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest bloqueador-ligacoes.apk \
            --title "APK mais recente" \
            --notes "Baixe o arquivo bloqueador-ligacoes.apk e instale no celular."

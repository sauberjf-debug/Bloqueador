name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

env:
  # Só existem depois que você cadastrar os "Secrets" no GitHub (ver LOJA/PASSO_A_PASSO.md).
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar APK de teste
        run: gradle assembleDebug

      # Com a chave cadastrada: gera APK e pacote .aab assinados com a MESMA chave sempre.
      - name: Gerar APK e pacote (.aab) assinados
        if: env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          KEYSTORE_PATH="$RUNNER_TEMP/upload.p12" gradle assembleRelease bundleRelease

      - name: Guardar pacote da Play Store
        if: env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: bloqueador-play-store-aab
          path: app/build/outputs/bundle/release/app-release.aab

      # Publica o .apk na aba "Releases" para baixar direto pelo celular.
      # Usa o APK assinado com a chave fixa quando existir (assim as atualizações instalam por cima).
      - name: Publicar APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk bloqueador-ligacoes.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk bloqueador-ligacoes.apk
          fi
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest bloqueador-ligacoes.apk \
            --title "APK mais recente" \
            --notes "Baixe o arquivo bloqueador-ligacoes.apk e instale no celular."
